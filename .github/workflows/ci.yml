name: Verify and deploy A.R.G.U.S.

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Pull requests must not cancel a production deployment. Pushes and manual
  # deployments for the same ref supersede an older run safely.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Test and build
    runs-on: ubuntu-latest
    env:
      # CI must never select a network that can broadcast transactions.
      VITE_ARGUS_BLOCKCHAIN_MODE: mock

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run lint checks
        run: npm run lint && npm run lint:css

      - name: Run behavior tests with coverage
        run: npm run test:coverage

      - name: Test encrypted relay and real HTTP synchronization
        run: npm run relay:test && npm run test:sync-integration

      - name: Build production app
        run: npm run build

      - name: Verify repository-path deployment
        run: npm run test:deploy

      - name: Configure GitHub Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5
        with:
          # Bootstrap the Pages site when this repository has not been enabled
          # yet, instead of failing the build with a Pages API 404.
          enablement: true

      - name: Upload GitHub Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Deploy GitHub Pages
    if: github.event_name != 'pull_request'
    needs: verify
    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    steps:
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
